<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="theme-color" content="#DC2626" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style id="root-style">
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background: radial-gradient(circle at 50% 10%, #450A0A 0%, #1A0505 50%, #0F0202 100%);
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #root {
        display: flex;
        height: 100%;
        width: 100%;
        flex: 1;
      }
      @media (max-width: 520px) {
        html, body, #root {
          background: #FFFDF7;
        }
      }
      /* Universal Scroll Resolution: ensure all flex containers shrink to viewport height */
      .r-13awgt0, .r-1pi2tsx {
        min-height: 0 !important;
      }
      /* All React Navigation stack screens and scene wrappers MUST allow vertical scrolling */
      div[class*="r-105ug2t"],
      div[data-testid="react-navigation-stack-scene"],
      [data-testid="react-navigation-scene"] {
        max-height: 100% !important;
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch !important;
        touch-action: pan-y !important;
        overscroll-behavior-y: contain !important;
      }
      /* Ensure all ScrollView containers allow vertical scrolling and clamp to screen height */
      div[style*="overflow-y: auto"], div[style*="overflow-y: scroll"], .r-overflowY-1rnoaur, [data-scrollable="true"] {
        max-height: 100% !important;
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch !important;
        overscroll-behavior-y: contain !important;
        touch-action: pan-y !important;
      }
      /* Custom Navratri scrollbar styling */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(254, 243, 199, 0.5);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #DC2626, #EA580C);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #B91C1C;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
